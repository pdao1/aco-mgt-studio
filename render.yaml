services:
  - type: web
    name: aco-studio
    runtime: node
    plan: free
    buildCommand: npm ci --legacy-peer-deps && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 60
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aco-studio-db
          property: connectionString
      - key: MAILBOX_ENCRYPTION_KEY
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: PORTAL_SECRET
        generateValue: true
      - key: SERVICE_SERIAL
        sync: false
      - key: SUPER_ADMIN_SERIAL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_DUE_DAYS
        value: "7"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: NOTIFICATION_SELLER_EMAIL
        sync: false
      - key: VENMO_PAYMENT_URL
        sync: false
      - key: OPERATOR_PASSWORD
        sync: false
      - key: APP_ORIGIN
        sync: false
      - key: NODE_ENV
        value: production
      - key: WORKSPACE_NAME
        value: ACO Studio
      - key: WORKSPACE_SLUG
        value: default
      - key: SYNC_INTERVAL_MINUTES
        value: "5"
      - key: SYNC_MAX_MESSAGES
        value: "500"

databases:
  - name: aco-studio-db
    databaseName: aco_studio
    user: aco_studio
    plan: free
